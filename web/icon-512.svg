<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1530"/>
      <stop offset="100%" stop-color="#050a15"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1a6fff"/>
      <stop offset="60%" stop-color="#05102e"/>
      <stop offset="100%" stop-color="#050a15"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="192" fill="url(#orb)" opacity="0.9"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="155" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.3"/>
  <text x="256" y="308" font-family="Arial Black, sans-serif" font-size="196" font-weight="900"
        text-anchor="middle" fill="#ffffff" filter="url(#glow)" opacity="0.95">K</text>
  <text x="256" y="308" font-family="Arial Black, sans-serif" font-size="196" font-weight="900"
        text-anchor="middle" fill="#00d4ff" opacity="0.25">K</text>
</svg>
